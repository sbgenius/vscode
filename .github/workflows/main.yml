name: JupyterLab on Windows Runner (ngrok)

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Password to access JupyterLab'
        required: true
        type: string
      ngrok_token:
        description: 'Your ngrok authtoken'
        required: true
        type: string
      duration_minutes:
        description: 'How long to keep the session alive (minutes)'
        required: false
        default: '350'
        type: string

jobs:
  jupyterlab:
    runs-on: windows-latest
    steps:
      - name: Checkout (optional, remove if not needed)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install JupyterLab
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install jupyterlab

      - name: Download and set up ngrok
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
          Expand-Archive -Path "ngrok.zip" -DestinationPath "." -Force
          ./ngrok.exe config add-authtoken ${{ github.event.inputs.ngrok_token }}

      - name: Generate Jupyter password hash
        shell: pwsh
        run: |
          $hash = python -c "from jupyter_server.auth import passwd; print(passwd('${{ github.event.inputs.password }}'))"
          $configDir = "$HOME\.jupyter"
          New-Item -ItemType Directory -Force -Path $configDir | Out-Null
          @"
          c.ServerApp.ip = '127.0.0.1'
          c.ServerApp.port = 8888
          c.ServerApp.open_browser = False
          c.ServerApp.password = '$hash'
          c.ServerApp.allow_remote_access = True
          "@ | Out-File -FilePath "$configDir\jupyter_lab_config.py" -Encoding utf8

      - name: Start JupyterLab (background)
        shell: pwsh
        run: |
          Start-Process -FilePath "jupyter" -ArgumentList "lab --config `"$HOME\.jupyter\jupyter_lab_config.py`"" -WindowStyle Hidden -RedirectStandardOutput "jupyter.log" -RedirectStandardError "jupyter-err.log"
          Start-Sleep -Seconds 15
          Get-Content "jupyter.log" -ErrorAction SilentlyContinue
          Get-Content "jupyter-err.log" -ErrorAction SilentlyContinue

      - name: Start ngrok tunnel (background)
        shell: pwsh
        run: |
          Start-Process -FilePath ".\ngrok.exe" -ArgumentList "http 8888 --log=stdout --log-format=logfmt" -RedirectStandardOutput "ngrok.log" -WindowStyle Hidden
          Start-Sleep -Seconds 8

      - name: Retrieve public ngrok URL
        shell: pwsh
        run: |
          $maxAttempts = 10
          $url = $null
          for ($i = 0; $i -lt $maxAttempts; $i++) {
            try {
              $resp = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -Method Get
              if ($resp.tunnels.Count -gt 0) {
                $url = $resp.tunnels[0].public_url
                break
              }
            } catch {
              Start-Sleep -Seconds 3
            }
          }
          if ($null -eq $url) {
            Write-Error "Failed to retrieve ngrok URL"
            exit 1
          }
          Write-Host "=================================================="
          Write-Host " JupyterLab is live at: $url"
          Write-Host "=================================================="
          echo "JUPYTER_URL=$url" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Print connection info
        shell: pwsh
        run: |
          Write-Host "Access URL: ${{ env.JUPYTER_URL }}"
          Write-Host "Password was set via workflow input (not printed for security)"

      - name: Keep session alive
        shell: pwsh
        run: |
          $minutes = [int]"${{ github.event.inputs.duration_minutes }}"
          Write-Host "Keeping runner alive for $minutes minutes..."
          Start-Sleep -Seconds ($minutes * 60)
