name: Code-Server on Ubuntu Runner (ngrok)

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Password to access code-server'
        required: true
        type: string
      ngrok_token:
        description: 'Your ngrok authtoken'
        required: true
        type: string
      duration_minutes:
        description: 'How long to keep the session alive (minutes)'
        required: false
        default: '350'
        type: string

jobs:
  code-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (optional, remove if not needed)
        uses: actions/checkout@v4

      - name: Install code-server
        run: |
          curl -fsSL https://code-server.dev/install.sh | sh

      - name: Install ngrok
        run: |
          curl -fsSL -o ngrok.tgz https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz
          tar -xvzf ngrok.tgz
          sudo mv ngrok /usr/local/bin/ngrok
          ngrok config add-authtoken "${{ github.event.inputs.ngrok_token }}"

      - name: Configure code-server
        run: |
          mkdir -p ~/.config/code-server
          cat > ~/.config/code-server/config.yaml <<EOF
          bind-addr: 127.0.0.1:8080
          auth: password
          password: ${{ github.event.inputs.password }}
          cert: false
          EOF

      - name: Start code-server + ngrok, retrieve URL, keep alive
        run: |
          # Start code-server in background
          nohup code-server --bind-addr 127.0.0.1:8080 > code-server.log 2>&1 &
          sleep 10
          echo "---- code-server.log ----"
          cat code-server.log || true

          # Start ngrok in background
          nohup ngrok http 8080 --log=stdout --log-format=logfmt > ngrok.log 2>&1 &
          sleep 8

          # Poll ngrok's local API for the public URL
          url=""
          for i in $(seq 1 10); do
            resp=$(curl -s http://127.0.0.1:4040/api/tunnels || true)
            url=$(echo "$resp" | grep -o '"public_url":"[^"]*"' | head -n1 | cut -d'"' -f4)
            if [ -n "$url" ]; then
              break
            fi
            sleep 3
          done

          if [ -z "$url" ]; then
            echo "---- Diagnostic dump: ngrok not reachable at 127.0.0.1:4040 ----"
            echo "---- ngrok.log ----"
            cat ngrok.log || true
            echo "Failed to retrieve ngrok URL"
            exit 1
          fi

          echo "=================================================="
          echo " Code-Server is live at: $url"
          echo " Password was set via workflow input (not printed for security)"
          echo "=================================================="

          # Keep this step (and therefore the background processes) alive
          minutes="${{ github.event.inputs.duration_minutes }}"
          echo "Keeping runner alive for $minutes minutes..."
          sleep $(( minutes * 60 ))
